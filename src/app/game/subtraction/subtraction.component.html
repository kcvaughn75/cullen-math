<div class="container">
  @if (showJuju) {
  <app-image class="img-juju" />
  } @if (currentProblem && showJuju === false) {
  <h2>Let's Subtract!</h2>
  <div class="math-equation">
    <p>{{ currentProblem.number1 }} - {{ currentProblem.number2 }} = ?</p>
    <div class="choices">
      @for (choice of currentProblem.choices; track choice) {
      <button (click)="checkAnswer(choice)" class="choice-button">
        {{ choice }}
      </button>
      }
    </div>
  </div>
  }
</div>
